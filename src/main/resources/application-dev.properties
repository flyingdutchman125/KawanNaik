# ===============================================================
# Profile: dev (H2 file lokal - Tanpa Perlu Install MySQL)
# ===============================================================

# Persisten lokal: data tidak hilang saat backend restart
spring.datasource.url=jdbc:h2:file:./data/kawannaik;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Web Console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=KawanNaikSecretKeyYangPanjangUntukJWT2024SuperSecret
app.jwt.expiration=86400000

# Springdoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
