# ===============================================================
# KawanNaik - Application Configuration
# ===============================================================

# Profil default: 'dev' (H2 file lokal persisten - siap pakai tanpa MySQL)
# Ganti ke 'mysql' atau jalankan dengan '-Dspring-boot.run.profiles=mysql' jika menggunakan MySQL
spring.profiles.active=dev

# JWT Configuration
app.jwt.secret=KawanNaikSecretKeyYangPanjangUntukJWT2024SuperSecret
app.jwt.expiration=86400000

# Springdoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
